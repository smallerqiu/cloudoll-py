[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudoll"
dynamic = ["version"]
description = "Assist in quickly creating distributable microservices based on aiohttp, with a focus on simplicity and ease of use."
authors = [
  {name = "Qiu", email = "smallerqiu@gmail.com"},
]
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
keywords = ["Microservices", "aiohttp", "cloudoll"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
  "watchfiles",
  "colorlog",
  "aiohttp",
  "jinja2",
  "pyjwt",
  "aiohttp_session[secure]",
  "PyYAML",
  "click",
  "envyaml",
  "psutil",
  "tabulate",
  "concurrent_log_handler"
]

[project.optional-dependencies]
cache = ["redis[hiredis]", "aiomcache"]
mysql = ["aiomysql>=0.2,<1"]
postgres = ["aiopg>=1.4,<2"]
aws = ["aws-advanced-python-wrapper>=3.1,<4", "mysql-connector-python>=8.1", "psycopg[binary]>=3.1.12,<4"]
dev = ["pytest>=7", "pytest-asyncio>=0.21", "pytest-cov>=4", "ruff>=0.9", "mypy>=1.10", "build", "setuptools>=77", "wheel"]

[tool.setuptools.dynamic]
version = {attr = "cloudoll.__version__"}

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
files = ["cloudoll/orm/protocols.py", "cloudoll/orm/values.py", "cloudoll/orm/query.py", "cloudoll/orm/streaming.py", "tests/typing/query_contract.py"]
strict = true
explicit_package_bases = true
follow_imports = "silent"

[[tool.mypy.overrides]]
module = "cloudoll.orm.query"
# Dynamic legacy expression/compiler APIs are not fully typed yet.
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests", "cloudoll/orm/test_sql.py"]
asyncio_mode = "auto"
markers = ["integration: requires an explicitly configured disposable database", "aws_failover: requires dedicated AWS staging infrastructure"]

[tool.setuptools.packages.find]
include = ["cloudoll*"]
namespaces = true
exclude = ["cloudoll.*.__pycache__", "cloudoll.*.__pycache__.*"]

[project.urls]
Homepage = "https://github.com/smallerqiu/cloudoll-py"
Repository = "https://github.com/smallerqiu/cloudoll-py"

[project.scripts]
cloudoll = "cloudoll.cli:cli"

[tool.setuptools.package-data]
"cloudoll" = ["py.typed"]
"cloudoll.template" = [
  "README.md",
  "requirements.txt",
  "config/*.yaml",
  "controllers/**/*.py",
  "middlewares/*.py",
  "static/**/*",
  "templates/*.html",
]
