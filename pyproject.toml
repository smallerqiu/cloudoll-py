[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudoll"
version = "3.0.14" 
description = "Assist in quickly creating distributable microservices based on aiohttp, with a focus on simplicity and ease of use."
authors = [
  {name = "Qiu", email = "smallerqiu@gmail.com"},
]
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
keywords = ["Microservices", "aiohttp", "cloudoll"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
  "watchfiles",
  "colorlog",
  "aiohttp",
  "redis[hiredis]",
  "aiomcache",
  "jinja2",
  "pyjwt",
  "aiohttp_session[secure]",
  "PyYAML",
  "click",
  "envyaml",
  "psutil",
  "tabulate",
  "concurrent_log_handler"
]

[project.optional-dependencies]
mysql = ["aiomysql>=0.2,<1"]
postgres = ["aiopg>=1.4,<2"]
aws = ["aws-advanced-python-wrapper>=2,<4", "mysql-connector-python>=8", "psycopg[binary]>=3,<4", "sqlalchemy>=2,<3"]
dev = ["pytest>=7", "pytest-asyncio>=0.21", "build", "setuptools>=77", "wheel"]

[tool.pytest.ini_options]
testpaths = ["tests", "cloudoll/orm/test_sql.py"]
asyncio_mode = "auto"
markers = ["integration: requires an explicitly configured disposable database", "aws_failover: requires dedicated AWS staging infrastructure"]

[tool.setuptools.packages.find]
include = ["cloudoll*"]
namespaces = true
exclude = ["cloudoll.*.__pycache__", "cloudoll.*.__pycache__.*"]

[project.urls]
Homepage = "https://github.com/smallerqiu/cloudoll-py"
Repository = "https://github.com/smallerqiu/cloudoll-py"

[project.scripts]
cloudoll = "cloudoll.cli:cli"

[tool.setuptools.package-data]
"cloudoll.template" = [
  "README.md",
  "requirements.txt",
  "config/*.yaml",
  "controllers/**/*.py",
  "middlewares/*.py",
  "static/**/*",
  "templates/*.html",
]
