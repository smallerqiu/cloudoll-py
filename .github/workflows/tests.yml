name: Tests and package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: cloudoll-test
          MYSQL_DATABASE: cloudoll_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pcloudoll-test"
          --health-interval=10s --health-timeout=5s --health-retries=15
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: cloudoll-test
          POSTGRES_DB: cloudoll_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s --health-timeout=5s --health-retries=15
    env:
      CLOUDOLL_TEST_MYSQL_URL: mysql://root:cloudoll-test@127.0.0.1:3306/cloudoll_test
      CLOUDOLL_TEST_POSTGRES_URL: postgres://postgres:cloudoll-test@127.0.0.1:5432/cloudoll_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[mysql,postgres,cache,dev]'
      - if: matrix.python == '3.13'
        run: python -m pip install -e '.[aws]'
      - run: python -m ruff check cloudoll tests
      - run: python -m mypy
      # AWS implementation remains unverified; enable its tests only after explicit approval.
      - run: python -m pytest -q -m 'not aws_failover' -k 'not aws' --cov=cloudoll.orm.engine --cov=cloudoll.orm.streaming --cov=cloudoll.web.request_data --cov-report=term-missing --cov-fail-under=85
      - run: python -m build
      - run: python -m pip install twine
      - run: python -m twine check dist/*
      - run: python tests/check_wheel.py dist/*.whl
      - run: python tests/check_release.py dist/*.whl
      - run: python -m pip freeze > resolved-dependencies.txt
      - uses: actions/upload-artifact@v7
        with:
          name: package-python-${{ matrix.python }}
          path: |
            dist/*
            resolved-dependencies.txt

  platform-smoke:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[mysql,postgres,cache,dev]'
      - run: python -m pytest -q -m 'not integration' -k 'not aws'
      - run: python -m build
      - shell: bash
        run: python tests/check_wheel.py dist/*.whl
