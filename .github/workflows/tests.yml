name: Tests and package
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[mysql,postgres,dev]'
      - if: matrix.python == '3.13'
        run: python -m pip install -e '.[aws]'
      - run: python -m pytest -q
      - run: python -m build
      - run: python tests/check_wheel.py dist/cloudoll-3.0.14-py3-none-any.whl
