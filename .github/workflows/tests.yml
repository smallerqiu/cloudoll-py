name: Tests and package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.13']
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: cloudoll-test
          MYSQL_DATABASE: cloudoll_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pcloudoll-test"
          --health-interval=10s --health-timeout=5s --health-retries=15
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: cloudoll-test
          POSTGRES_DB: cloudoll_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s --health-timeout=5s --health-retries=15
    env:
      CLOUDOLL_TEST_MYSQL_URL: mysql://root:cloudoll-test@127.0.0.1:3306/cloudoll_test
      CLOUDOLL_TEST_POSTGRES_URL: postgres://postgres:cloudoll-test@127.0.0.1:5432/cloudoll_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[mysql,postgres,dev]'
      - if: matrix.python == '3.13'
        run: python -m pip install -e '.[aws]'
      - run: python -m pytest -q -m 'not aws_failover'
      - run: python -m build
      - run: python tests/check_wheel.py dist/cloudoll-3.0.14-py3-none-any.whl
