name: Publish to PyPI
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-guard:
    if: github.repository == 'smallerqiu/cloudoll-py'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a stable version tag on master
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git merge-base --is-ancestor HEAD origin/master

  tests:
    needs: release-guard
    uses: ./.github/workflows/tests.yml

  security:
    needs: release-guard
    uses: ./.github/workflows/security.yml

  publish:
    needs: [tests, security]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/cloudoll/
    permissions:
      id-token: write
    steps:
      # Publish the tested artifact from this run, never rebuild with upload rights.
      - uses: actions/download-artifact@v8
        with:
          name: release-dist
          path: dist/
          digest-mismatch: error
      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: false
