server:
  host: 127.0.0.1
  port: 9001
  ignore_dirs: ["logs", "test"]
  client_max_size: 10000
  # HTTPS works the same under `cloudoll start` and production runs. Set both
  # files or neither; relative paths are resolved from this project root.
  #   ssl_certfile: ./certs/fullchain.pem
  #   ssl_keyfile: ./certs/privkey.pem
  static:
    prefix: /static

# database:
#   mysql_db:
#     url: mysql://username:password@host:port/database
#     echo: false  # SQL debug logging (INFO)
#     echo_params: false  # Requires echo; may expose sensitive values
#   postgres_db:
#     url: postgres://username:password@host:port/database
#     echo: false
#     echo_params: false
#   redis_0:
#     url: redis://host:port:/0
#   sqlite_db:
#     url: sqlite:///./dev.db   # Relative paths follow the directory you start from
#     journal_mode: WAL         # Optional; friendlier for concurrent readers
#   # SQLite is a local file: there is no transport TLS, file permissions decide
#   # who can read it. Prefer MySQL/PostgreSQL for multi-host deployments.

# Optional: enable class-level ORM queries after configuring mysql_db or sqlite_db above.
# orm:
#   default: mysql_db

# Session cookie is encrypted with this key. `cloudoll create` writes a random
# value to .env; production injects the same variable name. Without a stable key
# every restart and every worker invalidates existing sessions.
session:
  secret_key: $CLOUDOLL_SESSION_SECRET
# Cookie lifetime in seconds and cookie scoping are optional:
#   max_age: 604800
#   domain: example.com
#   path: /
#   samesite: Lax
# Server-side storage replaces the encrypted cookie:
#   redis: redis://host:port/0
#   memcached:
#     host: 192.168.1.100
#     port: 11211

jwt:
  key: $CLOUDOLL_JWT_SECRET
  exp: 604800
